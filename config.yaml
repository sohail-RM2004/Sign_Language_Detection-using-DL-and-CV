# Sign Language Recognition Configuration

# Model Parameters
model:
  img_size: [64, 64]
  num_classes: 29
  architecture: "efficient_cnn"  # or "transfer_learning"

# Training Parameters
training:
  epochs: 5
  batch_size: 32
  learning_rate: 0.0005
  max_samples_per_class: 500
  validation_split: 0.1
  test_split: 0.2

# Data Augmentation
augmentation:
  rotation_range: 10
  width_shift_range: 0.1
  height_shift_range: 0.1
  zoom_range: 0.1
  horizontal_flip: false

# Real-time Detection
detection:
  confidence_threshold: 0.4
  prediction_threshold: 0.3
  prediction_history_size: 5
  stable_predictions_required: 3
  update_delay: 1.0

# Paths
paths:
  dataset: "datasetasl/asl_alphabet_train/asl_alphabet_train"
  save_dir: "sign_language_project"
  model_file: "best_sign_model.keras"
  classes_file: "sign_language_project/classes.pkl"

# MediaPipe Settings
mediapipe:
  max_num_hands: 1
  min_detection_confidence: 0.7
  min_tracking_confidence: 0.5